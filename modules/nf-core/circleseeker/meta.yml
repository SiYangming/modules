name: "circleseeker"
description: Detect and characterize eccDNA from PacBio HiFi long-read sequencing data
keywords:
  - eccDNA
  - long-read
  - circular-dna
  - hifi
  - pacbio
tools:
  - "circleseeker":
      description: "Comprehensive detection and characterization of extrachromosomal circular DNA (eccDNA) from PacBio HiFi sequencing data"
      homepage: "https://github.com/YaoxinBio/CircleSeeker"
      documentation: "https://github.com/YaoxinBio/CircleSeeker#readme"
      tool_dev_url: "https://github.com/YaoxinBio/CircleSeeker"
      licence:
        - "GPL-3.0-only"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - reads:
        type: file
        description: Input HiFi reads (FASTA or FASTQ, gzipped or plain). FASTQ is converted to FASTA inside the process.
        pattern: "*.{fa,fasta,fastq,fq,fa.gz,fasta.gz,fastq.gz,fq.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_1929"
          - edam: http://edamontology.org/format_1930 # FASTQ
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'ref' ]`
    - fasta:
        type: file
        description: Reference genome FASTA file
        pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_1929"

output:
  summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_eccDNA_summary.csv:
          type: file
          description: Combined eccDNA table (one row per eccDNA)
          pattern: "*_eccDNA_summary.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  summary_txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_summary.txt:
          type: file
          description: Text summary statistics report
          pattern: "*_summary.txt"
          ontologies:
            - edam: http://edamontology.org/format_2330 # Textual format
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_report.html:
          type: file
          description: Interactive HTML report
          pattern: "*_report.html"
          ontologies:
            - edam: http://edamontology.org/format_2331 # HTML
  versions_circleseeker:
    - - ${task.process}:
          type: string
          description: The name of the process
      - circleseeker:
          type: string
          description: The name of the tool
      - circleseeker --version 2>&1 | sed 's/CircleSeeker //':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - circleseeker:
          type: string
          description: The name of the tool
      - circleseeker --version 2>&1 | sed 's/CircleSeeker //':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@SiYangming"
maintainers:
  - "@SiYangming"
